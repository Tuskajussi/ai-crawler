# Replace crawl.example.com and certificate paths before installing.
# Certificates must already exist and be renewed by your chosen TLS tooling.
server {
    listen 80;
    listen [::]:80;
    server_name crawl.example.com;
    return 301 https://crawl.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crawl.example.com;

    ssl_certificate /etc/letsencrypt/live/crawl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawl.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite client-supplied forwarded addresses at the trusted edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

services:
  crawlspace:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      CRAWLSPACE_HOST: 0.0.0.0
      CRAWLSPACE_PORT: 3001
      CRAWLSPACE_DATA_DIR: /data
      # Host Nginx crosses a Docker bridge; do not trust arbitrary forwarded IPs.
      CRAWLSPACE_TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - crawlspace-data:/data
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:3001/api/health', { headers: { Host: new URL(process.env.CRAWLSPACE_PUBLIC_URL).host } }); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  crawlspace-data:
